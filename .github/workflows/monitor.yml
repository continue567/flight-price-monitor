name: Flight Price Monitor

on:
  schedule:
    # 每天 01:00  UTC（北京时间 09/15/21/03 点）
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      from_code:
        description: '出发地三字码 (如 SZX)'
        required: true
        default: 'SZX'
      from_name:
        description: '出发地名称 (如 深圳)'
        required: true
        default: '深圳'
      to_code:
        description: '目的地三字码 (如 SHA)'
        required: true
        default: 'SHA'
      to_name:
        description: '目的地名称 (如 上海)'
        required: true
        default: '上海'
      depart_dates:
        description: '去程日期, 逗号分隔 (如 2026-09-30,2026-10-01)'
        required: false
        default: ''
      return_dates:
        description: '回程日期, 逗号分隔 (可选)'
        required: false
        default: ''
      platforms:
        description: '平台: fliggy,tuniu,qunar,tongcheng,ctrip'
        required: false
        default: 'fliggy,qunar,tongcheng'
      threshold:
        description: '低价提醒阈值（元）'
        required: false
        default: '500'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Generate rolling 20-day dates
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import os

          today = datetime.now(
              ZoneInfo("Asia/Shanghai")
          ).date()

          dates = [
              (today + timedelta(days=i)).isoformat()
              for i in range(1, 21)
          ]

          value = ",".join(dates)

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"ROLLING_DATES={value}\n")

          print("Monitoring dates:", value)
          PY

      - name: Build config from workflow_dispatch or defaults
        run: |
          python scripts/build_config.py \
            --from-code "${{ 'SZX' }}" \
            --from-name "${{ '深圳' }}" \
            --to-code "${{ 'SHA' }}" \
            --to-name "${{ '上海' }}" \
            --dates "${{ env.ROLLING_DATES }}" \
            --return-dates "${{ github.event.inputs.return_dates }}" \
            --platforms "${{ 'fliggy,qunar,tongcheng' }}" \
            --threshold "${{ '500' }}" \
            --serverchan-key "${{ secrets.SERVERCHAN_KEY }}" \
            --output config.yaml

      - name: Run price monitor (one round)
        run: python main.py --once
        timeout-minutes: 45

      - name: Export latest results to JSON
        run: |
          mkdir -p docs/data
          python scripts/export_results.py \
            --db data/prices.db \
            --out docs/data/latest.json

      - name: Render HTML report
        run: |
          python scripts/render_report.py \
            --results-file docs/data/latest.json \
            --out-dir docs/data

      - name: Commit data & report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "chore: update price data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
